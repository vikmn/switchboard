<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Terminal Charcoal Background -->
  <rect width="256" height="256" fill="#1e1e2e"/>

  <!-- Inactive Jacks Field (4x4 Patch Bay) -->
  <circle cx="112" cy="80" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="112" cy="80" r="2" fill="#363a4f"/>
  <circle cx="144" cy="80" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
