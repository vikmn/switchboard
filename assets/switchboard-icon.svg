  <circle cx="80" cy="112" r="2" fill="#363a4f"/>
  <circle cx="112" cy="112" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="112" cy="112" r="2" fill="#363a4f"/>
  <circle cx="144" cy="112" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="144" cy="112" r="2" fill="#363a4f"/>
  <circle cx="176" cy="112" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="176" cy="112" r="2" fill="#363a4f"/>
  <circle cx="80" cy="144" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="80" cy="144" r="2" fill="#363a4f"/>
  <circle cx="112" cy="144" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="112" cy="144" r="2" fill="#363a4f"/>
  <circle cx="144" cy="144" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="144" cy="144" r="2" fill="#363a4f"/>
  <circle cx="176" cy="144" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="176" cy="144" r="2" fill="#363a4f"/>
  <circle cx="112" cy="176" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="112" cy="176" r="2" fill="#363a4f"/>
  <circle cx="144" cy="176" r="6.5" stroke="#363a4f" stroke-width="2" fill="#24273a"/>
  <circle cx="144" cy="176" r="2" fill="#363a4f"/>

  <!-- Amber Cable (BL to TR, underlying path) -->
  <line x1="80" y1="176" x2="176" y2="80" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>

  <!-- Schematic Bridge / Cable Crossover Gap -->
  <circle cx="128" cy="128" r="5.5" fill="#1e1e2e"/>

  <!-- Glowing Green Cable (TL to BR, crossing over) -->
  <line x1="80" y1="80" x2="176" y2="176" stroke="#00ff9f" stroke-width="2" stroke-linecap="round"/>

  <!-- Active Patched Jacks -->
  <circle cx="80" cy="80" r="6.5" stroke="#00ff9f" stroke-width="2" fill="#1e1e2e"/>
  <circle cx="80" cy="80" r="2.5" fill="#00ff9f"/>
  <circle cx="176" cy="176" r="6.5" stroke="#00ff9f" stroke-width="2" fill="#1e1e2e"/>
  <circle cx="176" cy="176" r="2.5" fill="#00ff9f"/>

  <circle cx="80" cy="176" r="6.5" stroke="#ffb454" stroke-width="2" fill="#1e1e2e"/>
  <circle cx="80" cy="176" r="2.5" fill="#ffb454"/>
  <circle cx="176" cy="80" r="6.5" stroke="#ffb454" stroke-width="2" fill="#1e1e2e"/>
  <circle cx="176" cy="80" r="2.5" fill="#ffb454"/>
